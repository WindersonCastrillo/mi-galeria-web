<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeV2 - Catálogo y Horarios</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h1>Anime<span>🍁</span></h1>
        </div>
        
        <div class="buscador">
            <label for="buscar" class="sr-only">Buscar anime...</label>
            <input id="buscar" type="search" placeholder="Buscar anime...">
        </div>

        <nav aria-label="Navegación principal">
            <button id="btn-temporada" class="activo">Animes de Temporada</button>
            <button id="btn-calendario">Horarios de Emisión</button>
        </nav>
    </header>

    <main>
        <section id="hero-slider" aria-label="Anime Destacado">
            <div class="hero-overlay"></div>
            <div class="hero-container">
                <div class="hero-poster">
                    <img id="hero-img-src" src="https://via.placeholder.com/300x450" alt="Cargando Poster...">
                </div>
                <div class="hero-content">
                    <span class="estado" id="hero-estado">TV Anime • Otoño • En emisión</span>
                    <h2 id="hero-titulo">Conectando...</h2>
                    <div class="generos"></div>
                    <p id="hero-sinopsis">Conectando con los servidores de Jikan API...</p>
                    <div class="hero-botones">
                        <button class="btn-ver">▶ Ver Detalles</button>
                        <button class="btn-guardar" id="btn-guardar-favorito">🤍 Guardar en Mongo</button>
                    </div>
                </div>
            </div>
        </section>

        <nav id="menu-dias" style="display: none;" aria-label="Días de la semana">
            <button class="dia-btn" data-dia="monday">Lunes</button>
            <button class="dia-btn" data-dia="tuesday">Martes</button>
            <button class="dia-btn" data-dia="wednesday">Miércoles</button>
            <button class="dia-btn" data-dia="thursday">Jueves</button>
            <button class="dia-btn activo-dia" data-dia="friday">Viernes</button>
            <button class="dia-btn" data-dia="saturday">Sábado</button>
            <button class="dia-btn" data-dia="sunday">Domingo</button>
        </nav>

        <section id="galeria" aria-label="Galería de animes">
            </section>
        
        <button id="cargar" style="display: none;">Cargar más datos</button>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
